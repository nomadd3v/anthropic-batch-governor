[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-governor"
version = "0.1.0"
description = "Anthropic batch governance service + standalone token calculator for apps that call the Anthropic Batch API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Aaron Neece" },
]

# Runtime dependencies. Stream A only needs pydantic + httpx; Stream B/C
# add fastapi, uvicorn, anthropic, supabase-py, PyYAML.
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pyyaml>=6,<7",
  "anthropic>=0.30",
  "supabase>=2.0",
  # Hot-state store — ADR-007 (supersedes ADR-002). redis-py 5.x async client
  # with optional hiredis parser for the loopback hot path.
  "redis[hiredis]>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "types-PyYAML>=6",
  # In-memory Redis for hermetic tests. Replaces the httpx.MockTransport-based
  # fakes that ADR-002's REST transport used.
  "fakeredis>=2.20,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "clients*"]
exclude = ["tests*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # pydantic v2 deprecation warnings from third-party code — don't fail on these.
  "default::DeprecationWarning:pydantic",
]

[tool.mypy]
python_version = "3.11"
strict = true
# clients/python/{governor,calc_tokens} are published as top-level packages
# (importable as `governor` / `calc_tokens`), so clients/python is on the
# mypy_path and each package is named explicitly.
packages = ["server", "governor", "calc_tokens"]
mypy_path = "clients/python:."
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
